onboarding = false
# Herdr — terminal workspace manager. Full reference: https://herdr.dev/docs/configuration/
# Print defaults with: herdr --default-config
# Apply edits to a running server with: herdr server reload-config

[keys]
# ctrl+a to match long-standing tmux muscle memory.
# Trade-off: panes no longer see ctrl+a as readline beginning-of-line.
prefix = "ctrl+a"

previous_agent = "prefix+,"
next_agent = "prefix+."
last_pane = "prefix+;"

# Navigate-mode (prefix+w): shift+j/k moves between workspaces
navigate_workspace_up = ["up", "shift+k", "p"]
navigate_workspace_down = ["down", "shift+j", "n"]

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+super+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[theme]
name = "gruvbox"

auto_switch = false
[ui]
agent_panel_sort = "spaces"
tab_bar_position = "bottom"

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
