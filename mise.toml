[dotfiles]
"~/.config/tmux" = {
  source = "home/.config/tmux",
  mode = "symlink-each",
}

"~/.config/git" = {
  source = "home/.config/git",
  mode = "symlink-each",
}

"~/.config/herdr" = {
  source = "home/.config/herdr",
  mode = "symlink-each",
}

"~/.config/hunk" = {
  source = "home/.config/hunk",
  mode = "symlink-each",
}

"~/.config/rustfmt" = {
  source = "home/.config/rustfmt",
  mode = "symlink-each",
}

"~/.config/vim" = {
  source = "home/.config/vim",
  mode = "symlink-each",
}

"~/.config/nvim" = {
  source = "home/.config/nvim",
  mode = "symlink-each",
}

"~/.bashrc" = {
  source = "home/.bashrc",
  mode = "symlink",
}

"~/.local/bin" = {
  source = "home/.local/bin",
  mode = "symlink-each",
}

"~/.editrc" = {
  source = "home/.editrc",
  mode = "symlink",
}

"~/.inputrc" = {
  source = "home/.inputrc",
  mode = "symlink",
}

"~/.ssh/config" = {
  source = "home/.ssh/config",
  mode = "symlink",
}

"~/.pi/agent" = {
  source = "home/.pi/agent",
  mode = "symlink-each",
}
