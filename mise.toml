[dotfiles]
"~/.config/tmux" = {
  source = "home/.config/tmux",
  mode = "symlink-each",
}

"~/.config/git" = {
  source = "home/.config/git",
  mode = "symlink-each",
}

"~/.config/herdr" = {
  source = "home/.config/herdr",
  mode = "symlink-each",
}

"~/.config/hunk" = {
  source = "home/.config/hunk",
  mode = "symlink-each",
}

"~/.config/rustfmt" = {
  source = "home/.config/rustfmt",
  mode = "symlink-each",
}

"~/.config/vim" = {
  source = "home/.config/vim",
  mode = "symlink-each",
}

"~/.config/nvim" = {
  source = "home/.config/nvim",
  mode = "symlink-each",
}

"~/.bashrc" = {
  source = "home/.bashrc",
  mode = "symlink",
}

"~/.local/bin" = {
  source = "home/.local/bin",
  mode = "symlink-each",
}

"~/.editrc" = {
  source = "home/.editrc",
  mode = "symlink",
}

"~/.inputrc" = {
  source = "home/.inputrc",
  mode = "symlink",
}

"~/.ssh/config" = {
  source = "home/.ssh/config",
  mode = "symlink",
}

"~/.pi/agent" = {
  source = "home/.pi/agent",
  mode = "symlink-each",
}

"~/.bash_aliases" = {
  source = "home/.bash_aliases",
  mode = "symlink",
}

"~/.config/mise/config.toml" = {
  source = "home/.config/mise/config.toml",
  mode = "symlink",
}

[bootstrap.repos]
"external-skills/mattpocock-skills" = { url = "https://github.com/mattpocock/skills.git", ref = "main" }
"external-skills/humanlayer-skills" = { url = "https://github.com/humanlayer/skills.git", ref = "main" }
"external-skills/pstack" = { url = "https://github.com/backnotprop/pstack.git", ref = "main" }
"external-skills/backnotprop-bro" = { url = "https://github.com/backnotprop/bro.git", ref = "main" }
