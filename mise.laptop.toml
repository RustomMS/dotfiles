[bootstrap.packages]
"brew:vim" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:maccy" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:wezterm" = "latest"

[dotfiles]
"~/.bashrc.local" = {
  source = "home/.bashrc.laptop",
  mode = "symlink",
}

"~/.config/aerospace" = {
  source = "home/.config/aerospace",
  mode = "symlink-each",
}

"~/.config/ghostty" = {
  source = "home/.config/ghostty",
  mode = "symlink-each",
}

"~/.config/wezterm" = {
  source = "home/.config/wezterm",
  mode = "symlink-each",
}
